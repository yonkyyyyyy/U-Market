<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div
    class="flex w-full max-w-5xl overflow-hidden rounded-2xl bg-white shadow-2xl"
  >

    <!-- PANEL IZQUIERDO -->
    <div
      class="relative hidden min-h-[650px] w-1/2 bg-cover bg-center lg:block"
      style="background-image: url('https://images.unsplash.com/photo-1546514714-df0ccc50d7bf?auto=format&fit=crop&w=900&q=80')"
    >

      <!-- Overlay -->
      <div class="absolute inset-0 bg-black/40"></div>

      <!-- Contenido -->
      <div class="relative z-10 flex h-full flex-col justify-between p-10 text-white">

        <!-- Branding -->
        <div>
          <h1 class="text-5xl font-bold tracking-tight">
            U-Market
          </h1>

          <p class="mt-3 text-2xl font-semibold">
            Compra, vende, conecta.
          </p>

          <p class="mt-2 text-lg text-gray-200">
            Tu comunidad universitaria en un solo lugar.
          </p>
        </div>

        <!-- Beneficios -->
        <div class="grid grid-cols-3 gap-4 text-center">

          <div>
            <div class="mb-3 flex justify-center">
              <svg
                class="h-9 w-9"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 2h12m-8 4a1 1 0 11-2 0 1 1 0 012 0zm8 0a1 1 0 11-2 0 1 1 0 012 0z"
                />
              </svg>
            </div>

            <p class="text-sm font-medium">
              Compra y vende
            </p>

            <p class="text-sm text-gray-200">
              entre estudiantes
            </p>
          </div>

          <div>
            <div class="mb-3 flex justify-center">
              <svg
                class="h-9 w-9"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m4-8a4 4 0 110 8 4 4 0 010-8z"
                />
              </svg>
            </div>

            <p class="text-sm font-medium">
              Conecta con tu
            </p>

            <p class="text-sm text-gray-200">
              comunidad
            </p>
          </div>

          <div>
            <div class="mb-3 flex justify-center">
              <svg
                class="h-9 w-9"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
            </div>

            <p class="text-sm font-medium">
              Haz crecer tus
            </p>

            <p class="text-sm text-gray-200">
              oportunidades
            </p>
          </div>

        </div>
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="w-full p-8 sm:p-10 lg:w-1/2 lg:p-12">

      <!-- Encabezado -->
      <div class="text-center">
        <h2 class="text-3xl font-bold text-gray-900">
          Bienvenido de nuevo
        </h2>

        <p class="mt-2 text-gray-500">
          Inicia sesión en tu cuenta de U-Market
        </p>
      </div>

      <!-- Google -->
      <button
        type="button"
        class="mt-8 flex w-full items-center justify-center gap-3 rounded-lg border border-gray-300 bg-white px-4 py-3 font-semibold text-gray-700 shadow-sm transition hover:bg-gray-50"
      >

        <!-- Google -->
        <svg class="h-6 w-6" viewBox="0 0 40 40">
          <path
            d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.045 27.2142 24.3525 30 20 30C14.4775 30 10 25.5225 10 20C10 14.4775 14.4775 9.99999 20 9.99999C22.5492 9.99999 24.8683 10.9617 26.6342 12.5325L31.3483 7.81833C28.3717 5.04416 24.39 3.33333 20 3.33333C10.7958 3.33333 3.33335 10.7958 3.33335 20C3.33335 29.2042 10.7958 36.6667 20 36.6667C29.2042 36.6667 36.6667 29.2042 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
            fill="#FFC107"
          />

          <path
            d="M5.25497 12.2425L10.7308 16.2583C12.2125 12.59 15.8008 9.99999 20 9.99999C22.5491 9.99999 24.8683 10.9617 26.6341 12.5325L31.3483 7.81833C28.3716 5.04416 24.39 3.33333 20 3.33333C13.5983 3.33333 8.04663 6.94749 5.25497 12.2425Z"
            fill="#FF3D00"
          />

          <path
            d="M20 36.6667C24.305 36.6667 28.2167 35.0192 31.1742 32.34L26.0159 27.975C24.3425 29.2425 22.2625 30 20 30C15.665 30 11.9842 27.2359 10.5975 23.3784L5.16254 27.5659C7.92087 32.9634 13.5225 36.6667 20 36.6667Z"
            fill="#4CAF50"
          />

          <path
            d="M36.3425 16.7358H35V16.6667H20V23.3333H29.4192C28.7592 25.1975 27.56 26.805 26.0133 27.9758L31.1742 32.3392C30.8092 32.6708 36.6667 28.3333 36.6667 20C36.6667 18.8825 36.5517 17.7917 36.3425 16.7358Z"
            fill="#1976D2"
          />
        </svg>

        Continuar con Google
      </button>

      <!-- Separador -->
      <div class="my-6 flex items-center gap-4">
        <span class="h-px flex-1 bg-gray-200"></span>

        <span class="text-sm text-gray-400">
          o inicia con tu correo
        </span>

        <span class="h-px flex-1 bg-gray-200"></span>
      </div>

      <!-- FORMULARIO -->
      <form (ngSubmit)="login()" class="space-y-5">

        <!-- Email -->
        <div>
          <label
            for="email"
            class="mb-2 block text-sm font-semibold text-gray-700"
          >
            Correo electrónico
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="tu@correo.com"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-700 outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-100"
          />
        </div>

        <!-- Password -->
        <div>

          <div class="mb-2 flex items-center justify-between">

            <label
              for="password"
              class="block text-sm font-semibold text-gray-700"
            >
              Contraseña
            </label>

            <a
              href="#"
              class="text-sm font-medium text-green-700 hover:text-green-800"
            >
              ¿Olvidaste tu contraseña?
            </a>

          </div>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Tu contraseña"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-700 outline-none transition focus:border-green-700 focus:ring-2 focus:ring-green-100"
          />

        </div>

        <!-- Botón -->
        <button
          type="submit"
          class="w-full rounded-lg bg-green-800 px-4 py-3 font-bold text-white transition hover:bg-green-900"
        >
          Iniciar sesión
        </button>

      </form>

      <!-- Registro -->
      <div class="my-7 flex items-center gap-4">
        <span class="h-px flex-1 bg-gray-200"></span>

        <span class="text-sm text-gray-400">
          o regístrate
        </span>

        <span class="h-px flex-1 bg-gray-200"></span>
      </div>

      <button
        type="button"
        (click)="goToRegister()"
        class="w-full rounded-lg border border-green-800 px-4 py-3 font-semibold text-green-800 transition hover:bg-green-50"
      >
        Crear una cuenta
      </button>

    </div>
  </div>
</div>
