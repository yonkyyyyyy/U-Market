<div class="toast-stack" aria-live="polite" aria-relevant="additions removals">
  @for (message of toastService.messages(); track message.id) {
    <article
      class="toast"
      [class.toast--success]="message.kind === 'success'"
      [class.toast--error]="message.kind === 'error'"
      [class.toast--info]="message.kind === 'info'"
      [attr.role]="message.kind === 'error' ? 'alert' : 'status'">
      <span class="toast__mark" aria-hidden="true">
        @if (message.kind === 'success') { ✓ }
        @if (message.kind === 'error') { ! }
        @if (message.kind === 'info') { i }
      </span>
      <div class="toast__copy">
        <p class="toast__title">{{ message.title }}</p>
        @if (message.description) {
          <p class="toast__description">{{ message.description }}</p>
        }
      </div>
      <button
        class="toast__dismiss"
        type="button"
        aria-label="Cerrar aviso"
        (click)="toastService.dismiss(message.id)">
        ×
      </button>
    </article>
  }
</div>
