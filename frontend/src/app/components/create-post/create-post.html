<div class="w-full bg-white p-6 border border-gray-200 rounded-xl shadow-sm">

  <div>

    <h5 class="text-xl font-semibold text-gray-900 mb-1">
      ¿Qué quieres publicar?
    </h5>

    <p class="text-sm text-gray-500 mb-6">
      Comparte algo con la comunidad de U-Market.
    </p>


    <div class="mb-4">

      <label
        for="post-content"
        class="block mb-2 text-sm font-medium text-gray-900">
        Tu publicación
      </label>

      <textarea
        id="post-content"
        rows="4"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 resize-none"
        placeholder="¿Qué quieres compartir?">
      </textarea>

    </div>


    @if (showImageUpload) {

      <div class="mb-5">

        @if (!selectedImage) {

          <label
            for="dropzone-file"
            class="flex flex-col items-center justify-center w-full h-52 bg-gray-50 border border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-gray-100 transition">

            <div class="flex flex-col items-center justify-center text-gray-500 pt-5 pb-6">

              <svg
                class="w-8 h-8 mb-3"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24">

                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 17h3a3 3 0 0 0 0-6h-.025a5.56 5.56 0 0 0 .025-.5A5.5 5.5 0 0 0 7.207 9.021C7.137 9.017 7.071 9 7 9a4 4 0 1 0 0 8h2.167M12 19v-9m0 0-2 2m2-2 2 2"/>

              </svg>

              <p class="mb-2 text-sm">
                <span class="font-semibold">
                  Haz clic para subir
                </span>
                o arrastra una imagen
              </p>

              <p class="text-xs">
                PNG, JPG o GIF · Máximo 5 MB
              </p>

            </div>

            <input
              id="dropzone-file"
              type="file"
              accept="image/png,image/jpeg,image/gif"
              class="hidden"
              (change)="onImageSelected($event)" />

          </label>

        } @else {

          <div class="relative rounded-lg overflow-hidden border border-gray-200">

            <img
              [src]="selectedImage"
              alt="Vista previa"
              class="w-full max-h-72 object-cover">

            <button
              type="button"
              (click)="removeImage()"
              class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-black/60 text-white rounded-full hover:bg-black/80">

              <span class="text-lg">
                ×
              </span>

              <span class="sr-only">
                Eliminar imagen
              </span>

            </button>

          </div>

        }

      </div>

    }


    <div class="flex items-center justify-between pt-4 border-t border-gray-100">

      <div class="flex items-center gap-2">

        <button
          type="button"
          (click)="toggleImageUpload()"
          class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 rounded-lg hover:bg-gray-100">

          <svg
            class="w-5 h-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24">

            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 18h.01M12 18h.01M9 18h.01M12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>

          </svg>

          Imagen

        </button>


        <button
          type="button"
          class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 rounded-lg hover:bg-gray-100">

          <svg
            class="w-5 h-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24">

            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 5a1 1 0 0 1 1-1h4.586a1 1 0 0 1 .707.293l8.414 8.414a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0L4.293 10.293A1 1 0 0 1 4 9.586V5Z"/>

          </svg>

          Categoría

        </button>

      </div>


      <button
        type="button"
        (click)="publish()"
        class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">

        Publicar

      </button>

    </div>

  </div>

</div>
