<form
  class="w-full rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
  (ngSubmit)="publish()">
  <div>
    <h2 class="mb-1 text-xl font-semibold text-gray-900">¿Qué quieres publicar?</h2>
    <p class="mb-6 text-sm text-gray-500">Comparte un producto con la comunidad de U-Market.</p>

    <div class="mb-4">
      <label for="product-title" class="mb-2 block text-sm font-medium text-gray-900">
        Nombre del producto
      </label>
      <input
        id="product-title"
        name="title"
        type="text"
        required
        maxlength="150"
        [(ngModel)]="title"
        placeholder="Ej. Libro de cálculo usado"
        class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-3 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" />
    </div>

    <div class="mb-4">
      <label for="product-description" class="mb-2 block text-sm font-medium text-gray-900">
        Descripción
      </label>
      <textarea
        id="product-description"
        name="description"
        rows="3"
        maxlength="2000"
        [(ngModel)]="description"
        placeholder="Cuéntale a la comunidad sobre el estado o los detalles del producto."
        class="block w-full resize-y rounded-lg border border-gray-300 bg-gray-50 p-3 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500"></textarea>
    </div>

    <div class="mb-5 max-w-xs">
      <label for="product-price" class="mb-2 block text-sm font-medium text-gray-900">
        Precio (S/)
      </label>
      <input
        id="product-price"
        name="price"
        type="number"
        required
        min="0.01"
        step="0.01"
        [(ngModel)]="price"
        placeholder="0.00"
        class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-3 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500" />
    </div>

    <p class="mb-4 text-xs text-gray-500">
      Por ahora el servidor guarda el título, la descripción y el precio. La carga de imágenes y categorías aún no está disponible.
    </p>

    @if (publishError) {
      <p class="mb-4 text-sm text-red-700" role="alert">{{ publishError }}</p>
    }

    <div class="flex justify-end border-t border-gray-100 pt-4">
      <button
        type="submit"
        [disabled]="isPublishing"
        class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
        {{ isPublishing ? 'Publicando…' : 'Publicar producto' }}
      </button>
    </div>
  </div>
</form>
