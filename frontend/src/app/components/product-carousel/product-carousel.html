<section class="relative w-full">

  <div class="relative h-64 md:h-80 overflow-hidden rounded-xl">

    @for (product of products; track product.id; let i = $index) {

      @if (i === currentSlide) {

        <div class="absolute inset-0 duration-500">

          <img
            [src]="product.image"
            [alt]="product.name"
            class="absolute block w-full h-full object-cover"
          />

          <div class="absolute inset-0 bg-black/35"></div>

          <div class="absolute bottom-0 left-0 right-0 p-6 text-white">

            <p class="text-sm opacity-90">
              Producto destacado
            </p>

            <h2 class="text-2xl font-semibold">
              {{ product.name }}
            </h2>

            <div class="flex items-center justify-between mt-2">

              <div>
                <p class="text-lg font-medium">
                  {{ product.price }}
                </p>

                <p class="text-sm opacity-90">
                  Publicado por {{ product.seller }}
                </p>
              </div>

              <button
                type="button"
                class="px-4 py-2 text-sm font-medium bg-white text-gray-900 rounded-lg hover:bg-gray-100">
                Ver publicación
              </button>

            </div>

          </div>

        </div>

      }

    }

  </div>


  <div class="absolute z-10 flex -translate-x-1/2 bottom-4 left-1/2 space-x-2">

    @for (product of products; track product.id; let i = $index) {

      <button
        type="button"
        (click)="goToSlide(i)"
        [attr.aria-current]="i === currentSlide"
        [attr.aria-label]="'Ir a producto ' + (i + 1)"
        [class.w-6]="i === currentSlide"
        [class.w-2]="i !== currentSlide"
        class="h-2 rounded-full bg-white transition-all">
      </button>

    }

  </div>


  <!-- Anterior -->
  <button
    type="button"
    (click)="previousSlide()"
    class="absolute top-0 start-0 z-10 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none">

    <span
      class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">

      <svg
        class="w-5 h-5 text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24">

        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="m15 19-7-7 7-7"/>

      </svg>

      <span class="sr-only">
        Anterior
      </span>

    </span>

  </button>


  <!-- Siguiente -->
  <button
    type="button"
    (click)="nextSlide()"
    class="absolute top-0 end-0 z-10 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none">

    <span
      class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">

      <svg
        class="w-5 h-5 text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24">

        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="m9 5 7 7-7 7"/>

      </svg>

      <span class="sr-only">
        Siguiente
      </span>

    </span>

  </button>

</section>
