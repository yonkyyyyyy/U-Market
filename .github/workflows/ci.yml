name: Java CI with Maven

# El pipeline se ejecutará automáticamente cuando:
on:
  push:
    branches: [ "main", "devOsQa", "backend" ] # Se ejecuta al hacer push en estas ramas
  pull_request:
    branches: [ "main" ] # Se ejecuta cuando intentan unir código a la rama principal

jobs:
  build-and-test:
    name: Compilar y Ejecutar Pruebas
    runs-on: ubuntu-latest

    # Definimos un contenedor de Base de Datos para que las pruebas funcionen en la nube
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: U-Market
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 15262005
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Descarga el código del repositorio en la máquina virtual de GitHub
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Instala Java 21 (La versión que usa tu proyecto)
    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven # Esto guarda las dependencias para que futuras ejecuciones sean más rápidas

    - name: Cache SonarQube packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # 3. Le da permisos de ejecución al archivo de Maven
    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x ./mvnw

    # 4. Construye el proyecto, ejecuta las pruebas y el análisis de SonarQube
    - name: Compilar y Testear con Maven y SonarQube
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/U-Market
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 15262005
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./mvnw clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=luisfacz7_U-Market
