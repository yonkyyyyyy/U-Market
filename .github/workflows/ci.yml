name: Java CI with Maven

# El pipeline se ejecutará automáticamente cuando:
on:
  push:
    # Agregamos  las ramas del resto del equipo
    branches: [ "main", "develop", "devOsQa", "backend", "fronted", "iaDatos" ]
  pull_request:
    # Crucial: Ahora validará los PRs que el equipo envíe hacia 'develop' y 'main'
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Compilar y Ejecutar Pruebas
    runs-on: ubuntu-latest

    # Definimos un contenedor de Base de Datos para que las pruebas funcionen en la nube
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: U-Market
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 15262005
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Descarga el código del repositorio en la máquina virtual de GitHub
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Instala Java 21 (La versión que usa tu proyecto)
    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven # Esto guarda las dependencias para que futuras ejecuciones sean más rápidas

    # 3. Le da permisos de ejecución al archivo de Maven
    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x ./mvnw

    # 4. Construye el proyecto y ejecuta las pruebas
    - name: Compilar y Testear con Maven
      run: ./mvnw clean verify

  deploy:
    name: Desplegar en Google Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    # SOLO despliega si el push/merge ocurre en develop, main o  rama de pruebas 
    if: github.ref == 'refs/heads/devOsQa' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Conectar al servidor por SSH y levantar Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "U-Market" ]; then
              git clone https://github.com/yonkyyyyyy/U-Market.git
            fi
            cd U-Market
            
            # Descarga todas las ramas y cambia automáticamente a la que disparó la acción
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Construye el archivo .env con todas las credenciales obligatorias
            cat <<EOF > .env
            RABBITMQ_PASSWORD=15262005
            RABBITMQ_USERNAME=umarket
            CLOUDINARY_CLOUD_NAME=test
            CLOUDINARY_API_KEY=test
            CLOUDINARY_API_SECRET=test
            OPENAI_API_KEY=test
            IA_INTERNAL_API_KEY=test
            EOF
            
            docker compose down
            docker compose up -d --build
