name: Java CI with Maven

# El pipeline se ejecutará automáticamente cuando:
on:
  push:
    # Agregamos  las ramas del resto del equipo
    branches: [ "main", "develop", "devOsQa", "backend", "fronted", "iaDatos" ]
  pull_request:
    # Crucial: Ahora validará los PRs que el equipo envíe hacia 'develop' y 'main'
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Compilar y Ejecutar Pruebas
    runs-on: ubuntu-latest

    # Definimos un contenedor de Base de Datos para que las pruebas funcionen en la nube
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: U-Market
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 15262005
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Descarga el código del repositorio en la máquina virtual de GitHub
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Instala Java 21 (La versión que usa tu proyecto)
    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven # Esto guarda las dependencias para que futuras ejecuciones sean más rápidas

    # 3. Le da permisos de ejecución al archivo de Maven
    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x ./mvnw

    # 4. Construye el proyecto y ejecuta las pruebas
    - name: Compilar y Testear con Maven
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/U-Market
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 15262005
      run: ./mvnw clean verify
