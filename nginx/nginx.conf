server {
    listen 80;
    server_name localhost;

    # Configuración para el Frontend y soporte de WebSockets en la UI
    location / {
        proxy_pass http://umarket_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cabeceras críticas para habilitar WebSockets (WSS/WS)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts extendidos para mantener la conexión persistente abierta
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Configuración para el Backend y endpoints de API / WebSockets
    location /api/ {
        proxy_pass http://umarket_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Soporte de WebSockets para canales del backend si aplica
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de persistencia para peticiones largas y sockets
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}