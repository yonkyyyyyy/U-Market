server {
    listen 80;
    server_name localhost;

    # Enruta todo el tráfico base al contenedor del Frontend
    location / {
        proxy_pass http://umarket_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_cycle;
        
        # Soporte para WebSockets (útil para recargas en vivo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Enruta las peticiones que empiecen con /api/ al contenedor del Backend
    location /api/ {
        proxy_pass http://umarket_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Configuración de Timeouts para evitar cuelgues
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}